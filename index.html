<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F3F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="좋아하는 문장을 예쁜 이미지로 발췌하는 도구">
<title>발췌 스튜디오</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23EFA9BC'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='serif'%3E%E2%80%9C%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&family=Noto+Serif+KR:wght@200..900&family=Nanum+Myeongjo:wght@400;700;800&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@100;200;300;400;500;600;700&family=Hahmlet:wght@100..900&family=Song+Myung&family=Nanum+Pen+Script&family=Gaegu:wght@300;400;700&family=Orbit&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&display=swap">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/card.css">
<link rel="stylesheet" href="css/designs.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-mark">“</span>발췌 스튜디오</div>
  <div class="top-actions">
    <button class="icon-btn" id="btnReset" aria-label="처음부터">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    </button>
    <button class="btn-primary" id="btnSave">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
      저장
    </button>
  </div>
</header>

<main class="layout">
  <section class="preview" id="preview">
    <div class="stage-wrap" id="stageWrap"><div class="stage" id="stage"><div class="card" id="card"></div></div></div>
    <span class="preview-meta" id="previewMeta"></span>
    <button class="preview-toggle" id="previewToggle">미리보기 작게</button>
  </section>

  <section class="panel">
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="design" aria-selected="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>디자인</button>
      <button class="tab" role="tab" data-tab="text" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg>글</button>
      <button class="tab" role="tab" data-tab="type" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V5h12v2M10 5v14M7 19h6M15 13v-1.5h6V13M18 11.5V19M16.5 19h3"/></svg>서체</button>
      <button class="tab" role="tab" data-tab="layout" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2.5"/><rect x="8" y="7" width="8" height="10" rx="1" stroke-dasharray="2 2"/></svg>레이아웃</button>
      <button class="tab" role="tab" data-tab="bg" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>배경</button>
    </nav>

    <div class="pane on" data-pane="design">
      <div class="group">
        <div class="group-head">디자인 고르기 <span class="hint">눌러서 적용</span></div>
        <div class="design-grid" id="designGrid"></div>
      </div>
      <div class="group" id="designFields"></div>
    </div>

    <div class="pane" data-pane="text">
      <div class="group">
        <div class="group-head">본문 <span class="hint">글자를 선택하고 꾸며보세요</span></div>
        <div class="editor-box">
          <div class="rt-toolbar" id="rtToolbar"></div>
          <div id="editor" class="editor" contenteditable="true" spellcheck="false" data-placeholder="발췌할 문장을 입력하세요"></div>
        </div>
      </div>
      <div class="group" id="creditGroup"></div>
    </div>

    <div class="pane" data-pane="type">
      <div class="group" id="typeGroup"></div>
      <div class="group" id="fontUploadGroup"></div>
    </div>

    <div class="pane" data-pane="layout">
      <div class="group" id="layoutGroup"></div>
    </div>

    <div class="pane" data-pane="bg">
      <div class="group" id="bgGroup"></div>
    </div>
  </section>
</main>

<div class="modal" id="exportModal" hidden>
  <div class="sheet" role="dialog" aria-label="이미지 저장">
    <div class="sheet-grip"></div>
    <div class="sheet-title">이미지 저장 <button class="icon-btn" id="btnCloseModal" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="sheet-img" id="exportImgBox"><div class="spinner"></div></div>
    <div class="sheet-actions">
      <button class="btn-ghost" id="btnCopy">이미지 복사</button>
      <button class="btn-primary btn-pink" id="btnDownload">저장 / 공유</button>
    </div>
    <p class="note" id="exportNote">아이폰에서는 이미지를 길게 눌러 ‘사진 앱에 저장’을 선택해도 돼요.</p>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="vendor/html2canvas.min.js"></script>
<script src="js/fonts.js"></script>
<script src="js/designs.js"></script>
<script src="js/app.js"></script>
</body>
</html>
